plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.jetbrains.kotlin.jvm' version '1.9.22'
}

//⑨
group = 'cn.starry.hub'
version = file("src/main/resources/plugin.yml").readLines().find { it.startsWith("version:") }.split(":")[1].trim().replace("'", "")

repositories {
    mavenCentral()
    maven { url 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url 'https://repo.papermc.io/repository/maven-public/' }
    maven { url 'https://repo.citizensnpcs.co/' }
}

sourceSets {
    main.kotlin.srcDirs += 'src/main/java'
}

dependencies {
    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Compile Only - Provided by Server or other Plugins
    compileOnly fileTree(dir: 'libs', include: ['*.jar'], exclude: [
            'citizensapi-2.0.41-SNAPSHOT.jar',
            'reflections-0.10.jar',
            'javax.annotation-api-1.3.2 (1).jar'
    ])
    
    compileOnly('net.citizensnpcs:citizens-main:2.0.35-SNAPSHOT') {
        exclude group: '*', module: '*'
    }

    // Implementation - Will be included in the shadow jar
    implementation files('libs/reflections-0.10.jar')
    implementation files('libs/javax.annotation-api-1.3.2 (1).jar')
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ["-Xlint:-removal"]
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "21"
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

shadowJar {
    archiveClassifier.set('') // Replace the default jar
    // archiveClassifier.set('all') // Or use 'all' if you want to keep the thin jar
    
    // Optional: Relocate packages to avoid conflicts if needed
    // relocate 'net.citizensnpcs', 'cn.starry.hub.libs.citizens'
    // relocate 'org.reflections', 'cn.starry.hub.libs.reflections'
}
